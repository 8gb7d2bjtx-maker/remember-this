    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg: #f0e4e4;
        --card: #ffffff;
        --card-hd: #faf0f0;
        --border: #dfc8c8;
        --border-lt: #f0e8e8;
        --text: #261010;
        --text-2: #9a6868;
        --text-3: #c09898;
        --accent: #7a2e2e;
        --badge-bg: #f0d4d4;
        --badge-txt: #7a2e2e;
        --del: #cc4444;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
    }

    html, body {
        height: 100%;
        background: var(--bg);
        font-family: 'DM Sans', sans-serif;
        color: var(--text);
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
    }

    #app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        padding: 52px 22px 16px;
        background: var(--bg);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    header h1 {
        font-family: 'DM Serif Display', serif;
        font-size: 32px;
        font-weight: 400;
        color: var(--text);
        letter-spacing: -0.5px;
    }

    #lists-container {
        flex: 1;
        padding: 4px 16px 100px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .empty {
        text-align: center;
        padding: 60px 32px;
        color: var(--text-2);
    }

    .empty p {
        font-size: 15px;
        line-height: 1.6;
    }

    .empty .hint {
        font-size: 13px;
        margin-top: 8px;
        color: var(--text-3);
    }/* Card */

    .list-card {
        background: var(--card);
        border: 0.5px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        transition: opacity 0.2s;
    }

    .list-card.drag-source {
        opacity: 0.3;
    }

    .list-card.drag-over-top {
        box-shadow: 0 -3px 0 0 var(--accent);
    }

    .list-card.drag-over-bottom {
        box-shadow: 0 3px 0 0 var(--accent);
    }/* Card header */

    .card-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 13px 16px;
        background: var(--card-hd);
        border-bottom: 0.5px solid var(--border-lt);
    }

    .drag-handle {
        color: var(--text-3);
        cursor: grab;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 2px;
        touch-action: none;
        user-select: none;
    }

    .card-title-input {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        background: transparent;
        border: none;
        outline: none;
        font-family: 'DM Sans', sans-serif;
        min-width: 0;
        -webkit-user-select: text;
        user-select: text;
    }

    .badge {
        font-size: 11px;
        background: var(--badge-bg);
        color: var(--badge-txt);
        padding: 2px 8px;
        border-radius: 20px;
        flex-shrink: 0;
    }

    .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-3);
        padding: 4px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        transition: color 0.15s;
        flex-shrink: 0;
    }

    .btn-icon:hover {
        color: var(--del);
    }/* Items */

    .item {
        display: flex;

<body>
    <div id="app">
        <header>
            <h1>remember this</h1>

        </header>
        <div id="loading">loading your lists…</div>
        <div id="lists-container" style="display:none"></div>
    </div>

    <button id="fab" onclick="openModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>

          new list
    </button>

    <div id="modal-overlay" onclick="handleOverlayClick(event)">
        <div id="modal">
            <h2>new list</h2>
            <input type="text" id="modal-input" placeholder="e.g. Movies, Restaurants, Books…" maxlength="60"/>
            <div id="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">cancel</button>
                <button class="btn-create" onclick="createList()">create list</button>
            </div>
        </div>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAbOEAwN8HImczvJOlWd83F9HCsumTzXYw",
        authDomain: "remember-this-658f8.firebaseapp.com",
        projectId: "remember-this-658f8",
        storageBucket: "remember-this-658f8.firebasestorage.app",
        messagingSenderId: "990663353602",
        appId: "1:990663353602:web:3615273902714207348e1b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listsMeta = [];
    let itemsMap = {};
    let itemUnsubs = {};

    // ── Helpers ────────────────────────────────────────────────────────────────

    function linkify(text) {
        const e = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return e.replace(/(https?:\/\/[^\s]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    }
    function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function updateSubtitle() {
        return;
        const total = Object.values(itemsMap).reduce((s, a) => s + a.length, 0);
        const n = listsMeta.length;
        const sub = document.getElementById('subtitle');
        if (sub)
            sub.textContent = `${n} list${n !== 1 ? 's' : ''} · ${total} item${total !== 1 ? 's' : ''}`;
    }

    const DOTS = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="4.5" cy="3"   r="1.2" fill="currentColor"/>
  <circle cx="9.5" cy="3"   r="1.2" fill="currentColor"/>
  <circle cx="4.5" cy="7"   r="1.2" fill="currentColor"/>
  <circle cx="9.5" cy="7"   r="1.2" fill="currentColor"/>
  <circle cx="4.5" cy="11"  r="1.2" fill="currentColor"/>
  <circle cx="9.5" cy="11"  r="1.2" fill="currentColor"/>
</svg>`






    ;

    // ── Render ─────────────────────────────────────────────────────────────────

    function renderCardItems(listId) {
        const card = document.getElementById('card-' + listId);
        if (!card)
            return;
        card.querySelectorAll('.item').forEach(el => el.remove());
        const items = (itemsMap[listId] || []).slice().sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
        const anchor = card.querySelector('.del-confirm');
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.id = 'item-' + item.id;
            div.dataset.listId = listId;
            div.dataset.itemId = item.id;
            div.innerHTML = `
      <div class="item-drag-handle" data-drag-item data-list-id="${listId}" data-item-id="${item.id}">${DOTS}</div>
      <div class="item-body">
        <textarea class="item-title-input" rows="1"
          onblur="saveItem('${

            listId}','${item.id}','title',this.value)"
          oninput="autoResize(this)"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey)this.blur()">${
            esc(item.title)}</textarea>
        ${item.note ? `<div class="item-note-wrap" id="note-wrap-${item.id}">
               <div class="item-note-display" onclick="editNoteInline('${item.id}')">${linkify(item.note)}</div>
               <textarea class="item-note-input"
                 onblur="saveNoteInline(this,'${
            listId}','${item.id}')"
                 oninput="autoResize(this)"
                 onkeydown="if(event.key==='Enter'&&!event.shiftKey)this.blur()"
               >${

            esc(item.note)}</textarea>
             </div>`
            : `<button class="item-note-add" onclick="addNoteInline('${listId}','${item.id}',this)">+ note</button>`
            }
      </div>
      <button class="item-del" onclick="removeItem('${
            listId}','${item.id}')" aria-label="remove">×</button>
    `
            ;
            card.insertBefore(div, anchor);
        });
        const badge = card.querySelector('.badge');
        if (badge)
            badge.textContent = items.length;
        updateSubtitle();
        reattachItemHandles(card, listId);
        // Auto-resize all textareas now that they're in the DOM
        card.querySelectorAll('.item-note-input, .item-title-input').forEach(ta => {
            ta.style.height = 'auto';
            ta.style.height = ta.scrollHeight + 'px';
        });
    }

    function buildCard(list) {
        const card = document.createElement('div');
        card.className = 'list-card';
        card.id = 'card-' + list.id;
        card.dataset.listId = list.id;
        card.innerHTML = `
    <div class="card-header">
      <div class="drag-handle" data-drag-list data-list-id="${
        list.id}" title="Hold to reorder">${DOTS}</div>
      <input class="card-title-input" value="${esc(list.name)}"
        onblur="renameList('${list.id}',this.value)"
        onkeydown="if(event.key==='Enter')this.blur()" aria-label="list name" />
      <span class="badge">0</span>
      <button class="btn-icon" onclick="confirmDeleteList('${

        list.id}')" aria-label="delete list">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </div>
    <div class="del-confirm" id="del-${





        list.id}">
      <span>remove this list and all its items?</span>
      <button class="btn-del-no"  onclick="cancelDeleteList('${
        list.id}')">cancel</button>
      <button class="btn-del-yes" onclick="deleteListConfirmed('${list.id}')">remove</button>
    </div>
    <div class="add-item-area">
      <div class="add-item-row">
        <input class="add-input" id="title-${


        list.id}" placeholder="add an item…" maxlength="200"
          onkeydown="if(event.key==='Enter')addItem('${list.id}')" />
        <button class="btn-add-confirm" onclick="addItem('${list.id}')">add</button>
      </div>
      <button class="note-toggle" onclick="toggleNote('${
        list.id}')">+ add a note or URL</button>
      <div class="note-row" id="note-row-${list.id}">
        <textarea class="note-input" id="note-${list.id}" placeholder="notes, links…" rows="2"></textarea>
      </div>
    </div>
  `


        ;
        attachListHandle(card, list.id);
        return card;
    }

    function renderAllLists() {
        const container = document.getElementById('lists-container');
        document.getElementById('loading').style.display = 'none';
        container.style.display = 'flex';

        if (listsMeta.length === 0) {
            container.innerHTML = `<div class="empty"><p>no lists yet</p><p class="hint">tap "new list" below to get started</p></div>`;
            updateSubtitle();
            return;
        }
        container.querySelector('.empty')?.remove();

        const sorted = listsMeta.slice().sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));

        sorted.forEach(list => {
            if (!document.getElementById('card-' + list.id)) {
                container.appendChild(buildCard(list));
                renderCardItems(list.id);
            }
        });

        container.querySelectorAll('.list-card').forEach(card => {
            if (!listsMeta.find(l => l.id === card.dataset.listId))
                card.remove();
        });

        // Keep DOM order in sync
        sorted.forEach(list => container.appendChild(document.getElementById('card-' + list.id)));

        updateSubtitle();
    }

    // ── Firestore ──────────────────────────────────────────────────────────────

    function subscribeItems(listId) {
        if (itemUnsubs[listId])
            return;
        // Try ordering by 'order'; fall back to createdAt if index missing
        const tryQuery = (field) => {
            const q = query(collection(db, 'lists', listId, 'items'), orderBy(field));
            return onSnapshot(q,
            snap => {
                itemsMap[listId] = snap.docs.map(d => ({
                    id: d.id,
                    ...d.data()
                }));
                renderCardItems(listId);
            },
            err => {
                if (field === 'order') {
                    itemUnsubs[listId] = tryQuery('createdAt');
                }
            }
            );
        };
        itemUnsubs[listId] = tryQuery('order');
    }

    // Try ordering lists by 'order'; fall back to createdAt
    function startListsListener(field) {
        const q = query(collection(db, 'lists'), orderBy(field));
        onSnapshot(q, snapshot => {
            const incoming = snapshot.docs.map(d => ({
                id: d.id,
                ...d.data()
            }));
            listsMeta.forEach(l => {
                if (!incoming.find(x => x.id === l.id)) {
                    itemUnsubs[l.id]?.();
                    delete itemUnsubs[l.id];
                    delete itemsMap[l.id];
                }
            });
            listsMeta = incoming;
            renderAllLists();
            listsMeta.forEach(l => subscribeItems(l.id));
        }, err => {
            if (field === 'order')
                startListsListener('createdAt');
        });
    }
    startListsListener('order');

    // ── Drag & Drop ────────────────────────────────────────────────────────────

    const LONG_PRESS = 380; // ms
    let drag = null;
    let lpTimer = null;

    function getXY(e) {
        const t = e.touches ? e.touches[0] : e;
        return {
            x: t.clientX,
            y: t.clientY
        };
    }

    function makeGhost(el) {
        const r = el.getBoundingClientRect();
        const g = el.cloneNode(true);
        g.className = 'drag-ghost';
        g.style.width = r.width + 'px';
        g.style.left = r.left + 'px';
        g.style.top = r.top + 'px';
        document.body.appendChild(g);
        return g;
    }

    function nudgeGhost(dx, dy) {
        if (!drag?.ghost)
            return;
        drag.ghost.style.left = (parseFloat(drag.ghost.style.left) + dx) + 'px';
        drag.ghost.style.top = (parseFloat(drag.ghost.style.top) + dy) + 'px';
    }

    function clearMarkers() {
        document.querySelectorAll('.drag-source,.drag-over-top,.drag-over-bottom')
        .forEach(el => el.classList.remove('drag-source', 'drag-over-top', 'drag-over-bottom'));
    }

    function cardAt(x, y) {
        return document.elementsFromPoint(x, y).find(el => el.classList.contains('list-card')) || null;
    }
    function itemAt(x, y, listId) {
        return document.elementsFromPoint(x, y).find(el => el.classList.contains('item') && el.dataset.listId === listId) || null;
    }

    // List handle
    function attachListHandle(card, listId) {
        const h = card.querySelector('[data-drag-list]');
        if (!h)
            return;
        const onStart = e => {
            const {x, y} = getXY(e);
            lpTimer = setTimeout(() => {
                const src = document.getElementById('card-' + listId);
                drag = {
                    type: 'list',
                    sourceId: listId,
                    ghost: makeGhost(src),
                    lastX: x,
                    lastY: y
                };
                src.classList.add('drag-source');
                navigator.vibrate?.(25);
                document.addEventListener('touchmove', onMove, {
                    passive: false
                });
                document.addEventListener('touchend', onEnd);
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
            }, LONG_PRESS);
            document.addEventListener('touchend', cancelLP, {
                once: true
            });
            document.addEventListener('touchmove', cancelLP, {
                once: true,
                passive: true
            });
            document.addEventListener('mouseup', cancelLP, {
                once: true
            });
        };
        h.addEventListener('touchstart', onStart, {
            passive: true
        });
        h.addEventListener('mousedown', onStart);
    }

    // Item handles (re-attached after each render)
    function reattachItemHandles(card, listId) {
        card.querySelectorAll('[data-drag-item]').forEach(oldH => {
            const fresh = oldH.cloneNode(true);
            oldH.replaceWith(fresh);
            const itemId = fresh.dataset.itemId;
            const onStart = e => {
                const {x, y} = getXY(e);
                lpTimer = setTimeout(() => {
                    const src = document.getElementById('item-' + itemId);
                    drag = {
                        type: 'item',
                        sourceId: itemId,
                        listId,
                        ghost: makeGhost(src),
                        lastX: x,
                        lastY: y
                    };
                    src.classList.add('drag-source');
                    navigator.vibrate?.(25);
                    document.addEventListener('touchmove', onMove, {
                        passive: false
                    });
                    document.addEventListener('touchend', onEnd);
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                }, LONG_PRESS);
                document.addEventListener('touchend', cancelLP, {
                    once: true
                });
                document.addEventListener('touchmove', cancelLP, {
                    once: true,
                    passive: true
                });
                document.addEventListener('mouseup', cancelLP, {
                    once: true
                });
            };
            fresh.addEventListener('touchstart', onStart, {
                passive: true
            });
            fresh.addEventListener('mousedown', onStart);
        });
    }

    function cancelLP() {
        clearTimeout(lpTimer);
    }

    function onMove(e) {
        if (!drag)
            return;
        e.preventDefault();
        const {x, y} = getXY(e);
        nudgeGhost(x - drag.lastX, y - drag.lastY);
        drag.lastX = x;
        drag.lastY = y;

        clearMarkers();
        if (drag.type === 'list') {
            document.getElementById('card-' + drag.sourceId)?.classList.add('drag-source');
            const tgt = cardAt(x, y);
            if (tgt && tgt.dataset.listId !== drag.sourceId) {
                const r = tgt.getBoundingClientRect();
                tgt.classList.add(y < r.top + r.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
            }
        } else {
            document.getElementById('item-' + drag.sourceId)?.classList.add('drag-source');
            const tgt = itemAt(x, y, drag.listId);
            if (tgt && tgt.dataset.itemId !== drag.sourceId) {
                const r = tgt.getBoundingClientRect();
                tgt.classList.add(y < r.top + r.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
            }
        }
    }

    async function onEnd() {
        if (!drag)
            return;
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);

        const x = drag.lastX,
            y = drag.lastY;

        if (drag.type === 'list') {
            const tgt = cardAt(x, y);
            if (tgt && tgt.dataset.listId !== drag.sourceId) {
                await reorderLists(drag.sourceId, tgt.dataset.listId, y);
            }
        } else {
            const tgt = itemAt(x, y, drag.listId);
            if (tgt && tgt.dataset.itemId !== drag.sourceId) {
                await reorderItems(drag.listId, drag.sourceId, tgt.dataset.itemId, y);
            }
        }

        drag.ghost.remove();
        clearMarkers();
        drag = null;
    }

    async function reorderLists(srcId, tgtId, py) {
        const sorted = listsMeta.slice().sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
        const srcIdx = sorted.findIndex(l => l.id === srcId);
        const tgtEl = document.getElementById('card-' + tgtId);
        const r = tgtEl?.getBoundingClientRect();
        let tgtIdx = sorted.findIndex(l => l.id === tgtId);
        if (r && py > r.top + r.height / 2)
            tgtIdx++;
        if (srcIdx === tgtIdx || srcIdx + 1 === tgtIdx)
            return;
        const arr = sorted.filter(l => l.id !== srcId);
        arr.splice(tgtIdx > srcIdx ? tgtIdx - 1 : tgtIdx, 0, sorted[srcIdx]);
        const batch = writeBatch(db);
        arr.forEach((l, i) => batch.update(doc(db, 'lists', l.id), {
            order: i
        }));
        await batch.commit();
    }

    async function reorderItems(listId, srcId, tgtId, py) {
        const sorted = (itemsMap[listId] || []).slice().sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
        const srcIdx = sorted.findIndex(i => i.id === srcId);
        const tgtEl = document.getElementById('item-' + tgtId);
        const r = tgtEl?.getBoundingClientRect();
        let tgtIdx = sorted.findIndex(i => i.id === tgtId);
        if (r && py > r.top + r.height / 2)
            tgtIdx++;
        if (srcIdx === tgtIdx || srcIdx + 1 === tgtIdx)
            return;
        const arr = sorted.filter(i => i.id !== srcId);
        arr.splice(tgtIdx > srcIdx ? tgtIdx - 1 : tgtIdx, 0, sorted[srcIdx]);
        const batch = writeBatch(db);
        arr.forEach((item, i) => batch.update(doc(db, 'lists', listId, 'items', item.id), {
            order: i
        }));
        await batch.commit();
    }

    // ── Modal & CRUD ───────────────────────────────────────────────────────────

    window.openModal = function() {
        document.getElementById('modal-overlay').classList.add('open');
        setTimeout(() => document.getElementById('modal-input').focus(), 100);
    };
    window.closeModal = function() {
        document.getElementById('modal-overlay').classList.remove('open');
        document.getElementById('modal-input').value = '';
    };
    window.handleOverlayClick = function(e) {
        if (e.target === document.getElementById('modal-overlay'))
            window.closeModal();
    };
    document.getElementById('modal-input').addEventListener('keydown', e => {
        if (e.key === 'Enter')
            window.createList();
    });

    window.createList = async function() {
        const input = document.getElementById('modal-input');
        const name = input.value.trim();
        if (!name) {
            input.focus();
            return;
        }
        window.closeModal();
        const maxOrder = listsMeta.reduce((m, l) => Math.max(m, l.order ?? 0), -1);
        await addDoc(collection(db, 'lists'), {
            name,
            order: maxOrder + 1,
            createdAt: Date.now()
        });
    };

    window.renameList = async function(listId, name) {
        const t = name.trim();
        if (t)
            await updateDoc(doc(db, 'lists', listId), {
                name: t
            });
    };

    window.confirmDeleteList = id => document.getElementById('del-' + id).classList.add('open');
    window.cancelDeleteList = id => document.getElementById('del-' + id).classList.remove('open');

    window.deleteListConfirmed = async function(listId) {
        const items = itemsMap[listId] || [];
        const batch = writeBatch(db);
        items.forEach(item => batch.delete(doc(db, 'lists', listId, 'items', item.id)));
        batch.delete(doc(db, 'lists', listId));
        await batch.commit();
    };

    window.addItem = async function(listId) {
        const titleEl = document.getElementById('title-' + listId);
        const noteEl = document.getElementById('note-' + listId);
        const title = titleEl?.value.trim();
        if (!title) {
            titleEl?.focus();
            return;
        }
        const note = noteEl?.value.trim() || '';
        if (titleEl) {
            titleEl.value = '';
            titleEl.focus();
        }
        if (noteEl)
            noteEl.value = '';
        document.getElementById('note-row-' + listId)?.classList.remove('visible');
        const existing = itemsMap[listId] || [];
        const maxOrder = existing.reduce((m, i) => Math.max(m, i.order ?? 0), -1);
        await addDoc(collection(db, 'lists', listId, 'items'), {
            title,
            note,
            order: maxOrder + 1,
            createdAt: Date.now()
        });
    };

    window.saveItem = async function(listId, itemId, field, value) {
        const trimmed = value.trim();
        if (field === 'title' && !trimmed)
            return;
        await updateDoc(doc(db, 'lists', listId, 'items', itemId), {
            [field]: trimmed
        });
    };

    window.editNoteInline = function(itemId) {
        const wrap = document.getElementById('note-wrap-' + itemId);
        if (!wrap)
            return;
        const ta = wrap.querySelector('.item-note-input');
        if (!ta)
            return;
        wrap.classList.add('editing');
        const len = ta.value.length;
        ta.setSelectionRange(len, len);
        ta.focus();
    };

    window.saveNoteInline = async function(ta, listId, itemId) {
        const trimmed = ta.value.trim();
        const wrap = ta.closest('.item-note-wrap');
        if (wrap)
            wrap.classList.remove('editing');
        await updateDoc(doc(db, 'lists', listId, 'items', itemId), {
            note: trimmed
        });
    };

    window.addNoteInline = function(listId, itemId, btn) {
        const body = btn.parentElement;
        btn.remove();
        // Build a wrap with display+textarea so it matches the saved state structure
        const wrap = document.createElement('div');
        wrap.className = 'item-note-wrap editing';
        wrap.id = 'note-wrap-' + itemId;
        const display = document.createElement('div');
        display.className = 'item-note-display';
        display.setAttribute('onclick', `editNoteInline('${itemId}')`);
        const ta = document.createElement('textarea');
        ta.className = 'item-note-input';
        ta.placeholder = 'note or URL…';
        ta.setAttribute('onblur', `saveItem('${listId}','${itemId}','note',this.value)`);
        ta.setAttribute('oninput', 'autoResize(this)');
        ta.setAttribute('onkeydown', "if(event.key==='Enter'&&!event.shiftKey)this.blur()");
        wrap.appendChild(display);
        wrap.appendChild(ta);
        body.appendChild(wrap);
        ta.focus();
    };

    window.autoResize = function(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    };

    window.removeItem = async function(listId, itemId) {
        await deleteDoc(doc(db, 'lists', listId, 'items', itemId));
    };

    window.toggleNote = function(listId) {
        const row = document.getElementById('note-row-' + listId);
        if (!row)
            return;
        row.classList.toggle('visible');
        if (row.classList.contains('visible'))
            document.getElementById('note-' + listId)?.focus();
    };
    </script>
</body>
</html>
